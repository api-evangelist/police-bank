  description: Public, unauthenticated Product Reference Data (PRD) API required of every
    Australian ADI under the Consumer Data Right. Serves machine-readable product details
    (rates, fees, features, eligibility) for Police Bank's transaction and savings accounts,
    term deposits, residential mortgages, personal loans, and credit/charge cards.
    Confirmed live at https://public.cdr.prd.policebank.com.au/cds-au/v1/banking/products
    (HTTP 200, x-v 3, 16 products across 5 categories). Conforms to the DSB Consumer
    Data Standards Banking API; not a Police Bank-proprietary contract.
