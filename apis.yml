aid: police-bank
url: https://raw.githubusercontent.com/api-evangelist/police-bank/refs/heads/main/apis.yml
name: Police Bank
kind: company
description: Police Bank is a mutual, member-owned Australian bank (ABN 95 087 650 799,
  ACN 087 650 799, AFSL / Australian Credit Licence No. 240018) founded to serve the
  New South Wales police community and their families and now open to the wider public.
  As an Authorised Deposit-taking Institution it participates in Australia's Consumer
  Data Right (Open Banking) regime as an active data holder - it publishes an unauthenticated
  Product Reference Data (PRD) API conforming to the Consumer Data Standards, and lets
  members share their banking data with ACCC-accredited data recipients. Police Bank
  states it is in the process of gaining ACCC accreditation to also receive data as an
  Accredited Data Recipient.
